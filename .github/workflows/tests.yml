name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (browser demos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  python:
    name: Python (Pong)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/pong
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/pong/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_pong -v

  java:
    name: Java (OOP Calculator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/oop-calculator/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac -encoding UTF-8 -d build *.java
      - run: java -Djava.awt.headless=true -cp build CalculatorTest
